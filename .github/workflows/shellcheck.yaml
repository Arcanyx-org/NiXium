name: Shellcheck

on:
  push:
    branches: [central, experimental]
    paths:
      - '**.sh'
      - '.shellcheckrc'
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - '**.sh'
      - '.shellcheckrc'
  merge_group:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v26
        with:
          install-url: https://nixos.org/nix/install

      - name: Run shellcheck via mission-control
        run: nix develop --command bash -c ", shellcheck"
